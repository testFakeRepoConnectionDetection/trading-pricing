app:
  name: Trading/Pricing
  flow-enrichment:
    data-category-field: data_category
  integrations:
    datahub:
      base-url: https://datahub.internal/api/v1/market-data
      target-application: DataHub
      data-category: MARKET_DATA
      payload-format: JSON
      payload-type: fixture.dto.MarketDataRequestDto
    booking:
      base-url: https://booking.internal/api/v1/trades
      target-application: Booking
      data-category: TRADE_CAPTURE
      payload-format: JSON
      payload-type: fixture.dto.TradeCaptureDto
