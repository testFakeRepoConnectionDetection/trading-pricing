app:
  name: Trading/Pricing
  business_function: FRONT_OFFICE
  pillar: "Trading & Analytics"
  flow-enrichment:
    data-field: data
    frequency-field: frequency
  integrations:
    analytics:
      base-url: https://analytics.internal/api/v1/trades
      target-application: Analytics
      connection-kind: API
      channel: /api/v1/trades
      data: trade
      frequency: real-time
    booking:
      base-url: https://booking.internal/api/v1/trades
      target-application: Booking
      connection-kind: API
      channel: /api/v1/trades
      data: trade
      frequency: real-time
  api:
    prices:
      path: /api/v1/prices
      called-by-application: Analytics
      connection-kind: API
      data: price
      frequency: real-time
  callers:
    - Analytics
